name: HomeStorage
options:
  bundleIdPrefix: com.homestorage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  HomeStorage:
    type: application
    platform: iOS
    sources:
      - path: HomeStorage
    info:
      path: HomeStorage/Info.plist
      properties:
        CFBundleDisplayName: HomeStorage
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow plain-HTTP to localhost / the LAN (the API is HTTP locally; the
        # Cloudflare Tunnel serves HTTPS in production).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homestorage.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
